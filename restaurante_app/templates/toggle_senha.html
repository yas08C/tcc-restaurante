<style>
    .campo-senha { position: relative; }
    .campo-senha input { padding-right: 78px; }
    .campo-senha .btn-olho {
        position: absolute;
        right: 6px;
        top: 6px;
        padding: 4px 10px;
        font-size: 0.8rem;
        cursor: pointer;
        border: 1px solid var(--vermelho-fundo);
        border-radius: 4px;
        background-color: var(--vermelho-fundo);
        color: var(--creme);
    }
    .campo-senha .btn-olho:hover { background-color: var(--vermelho-hover); }
</style>
<script>
    // Adiciona o botão "Mostrar/Ocultar" em todo campo de senha da página.
    document.querySelectorAll('input[type="password"]').forEach(function (input) {
        var wrap = document.createElement('div');
        wrap.className = 'campo-senha';
        input.parentNode.insertBefore(wrap, input);
        wrap.appendChild(input);

        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn-olho';
        btn.textContent = 'Mostrar';
        btn.setAttribute('aria-label', 'Mostrar senha');
        btn.addEventListener('click', function () {
            var oculto = input.type === 'password';
            input.type = oculto ? 'text' : 'password';
            btn.textContent = oculto ? 'Ocultar' : 'Mostrar';
            btn.setAttribute('aria-label', oculto ? 'Ocultar senha' : 'Mostrar senha');
        });
        wrap.appendChild(btn);
    });
</script>
