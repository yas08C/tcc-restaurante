{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<p class="link-admin"><a href="{% url 'login_adm' %}">Admin</a></p>
<h1>Entrar</h1>
<form method="post">
    {% csrf_token %}
    {% if request.GET.next %}<input type="hidden" name="next" value="{{ request.GET.next }}">{% endif %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Entrar</button>
</form>
<p style="margin-top:15px;">Não tem conta? <a href="{% url 'cadastro' %}" style="color: var(--dourado-claro);">Cadastre-se</a></p>
{% include 'toggle_senha.html' %}
{% endblock %}
