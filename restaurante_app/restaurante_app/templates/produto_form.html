{% extends 'base.html' %}
{% block title %}Produto{% endblock %}
{% block content %}
<h1>{% if form.instance.pk %}Editar Produto{% else %}Novo Produto{% endif %}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Salvar</button>
    <a href="{% url 'produto_list' %}" class="btn btn-primary">Cancelar</a>
</form>
{% endblock %}
